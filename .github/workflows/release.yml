name: Build and release MiaoRight

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event.repository.private
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x86_64
            runner: macos-26-intel
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      MIAORIGHT_BUILD_ARCH: ${{ matrix.arch }}
      MIAORIGHT_OFFSCREEN_TESTING: '1'
    steps:
      - name: Verify the tag and build architecture
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable version tag such as v0.1.1." >&2
            exit 1
          fi
          test "$(uname -m)" = "$MIAORIGHT_BUILD_ARCH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Import stable signing identity
        shell: bash
        env:
          MIAORIGHT_SIGNING_P12: ${{ secrets.MIAORIGHT_SIGNING_P12 }}
          MIAORIGHT_SIGNING_P12_PASSWORD: ${{ secrets.MIAORIGHT_SIGNING_P12_PASSWORD }}
          MIAORIGHT_SIGNING_IDENTITY: MiaoRight Release
        run: |
          if [[ -z "$MIAORIGHT_SIGNING_P12" || -z "$MIAORIGHT_SIGNING_P12_PASSWORD" ]]; then
            echo "MIAORIGHT_SIGNING_P12 and MIAORIGHT_SIGNING_P12_PASSWORD are required for stable release signing." >&2
            exit 1
          fi

          keychain="$RUNNER_TEMP/miaoright-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          printf '%s' "$MIAORIGHT_SIGNING_P12" | /usr/bin/base64 -D > "$RUNNER_TEMP/miaoright-signing.p12"
          security import "$RUNNER_TEMP/miaoright-signing.p12" \
            -k "$keychain" \
            -P "$MIAORIGHT_SIGNING_P12_PASSWORD" \
            -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/miaoright-signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain"

          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          identities="$(security find-identity -v -p codesigning "$keychain")"
          [[ "$identities" == *"\"$MIAORIGHT_SIGNING_IDENTITY\""* ]]
          echo "MIAORIGHT_REQUIRE_STABLE_SIGNING=1" >> "$GITHUB_ENV"
          echo "MIAORIGHT_SIGNING_IDENTITY=$MIAORIGHT_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "MIAORIGHT_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Prepare the tagged build
        shell: bash
        run: |
          for plist in Packaging/Info-{App,FinderSync,ArchivePreview}.plist; do
            test "$(plutil -extract CFBundleShortVersionString raw "$plist")" = "${RELEASE_TAG#v}"
          done
          xcodebuild -version
          swift --version
          {
            echo "MIAORIGHT_APP_OUTPUT=$RUNNER_TEMP/MiaoRight.app"
            echo "MIAORIGHT_SWIFT_BUILD_PATH=$RUNNER_TEMP/swift-build"
            echo "MIAORIGHT_ICON_OUTPUT=$RUNNER_TEMP/icons"
            echo "MIAORIGHT_TEST_STORAGE=$RUNNER_TEMP/test-storage"
            echo "MIAORIGHT_CLIPBOARD_TEST_STORAGE=$RUNNER_TEMP/test-clipboard"
            echo "MIAORIGHT_TEST_7ZZ_PATH=$RUNNER_TEMP/MiaoRight.app/Contents/Helpers/7zz"
          } >> "$GITHUB_ENV"
      - name: Build and verify the signed app
        shell: bash
        run: |
          ./scripts/build-app.sh release
          codesign --verify --deep --strict "$MIAORIGHT_APP_OUTPUT"
      - name: Run archive, update, and smoke tests
        shell: bash
        run: swift test -c release --scratch-path "$RUNNER_TEMP/swift-test" --filter 'Archive|AppUpdateTests|AppUpdateInstallerTests|SmokeTests'
      - name: Package and verify the release ZIP and DMG
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p release
          archive="$RUNNER_TEMP/release/MiaoRight-$RELEASE_TAG-$MIAORIGHT_BUILD_ARCH.zip"
          "$MIAORIGHT_TEST_7ZZ_PATH" a -tzip -mm=Deflate -snl -bd "$archive" MiaoRight.app
          "$MIAORIGHT_TEST_7ZZ_PATH" x -bd -o"$RUNNER_TEMP/unpacked" "$archive"
          codesign --verify --deep --strict "$RUNNER_TEMP/unpacked/MiaoRight.app"
          "$GITHUB_WORKSPACE/scripts/package-dmg.sh" \
            "$MIAORIGHT_APP_OUTPUT" \
            "$RELEASE_TAG" \
            "$MIAORIGHT_BUILD_ARCH" \
            "$RUNNER_TEMP/release/MiaoRight-$RELEASE_TAG-$MIAORIGHT_BUILD_ARCH.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: miaoright-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/release/*.zip
            ${{ runner.temp }}/release/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          security default-keychain -d user -s "$HOME/Library/Keychains/login.keychain-db" 2>/dev/null || true
          security delete-keychain "$RUNNER_TEMP/miaoright-signing.keychain-db" 2>/dev/null || true

  publish:
    if: github.event.repository.private
    name: Publish both builds
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: miaoright-*
          path: release
          merge-multiple: true
      - name: Publish the private GitHub release
        shell: bash
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          arm_zip="MiaoRight-$RELEASE_TAG-arm64.zip"
          intel_zip="MiaoRight-$RELEASE_TAG-x86_64.zip"
          arm_dmg="MiaoRight-$RELEASE_TAG-arm64.dmg"
          intel_dmg="MiaoRight-$RELEASE_TAG-x86_64.dmg"
          assets=("$arm_zip" "$intel_zip" "$arm_dmg" "$intel_dmg")
          sha256sum "${assets[@]}" > SHA256SUMS

          if existing=$(gh release view "$RELEASE_TAG" --json isDraft,assets 2>/dev/null); then
            if [[ "$(jq -r '.isDraft' <<< "$existing")" = true ]]; then
              gh release upload "$RELEASE_TAG" "${assets[@]}" SHA256SUMS --clobber
              gh release edit "$RELEASE_TAG" --draft=false
            else
              jq -e \
                --arg arm_zip "$arm_zip" --arg intel_zip "$intel_zip" \
                --arg arm_dmg "$arm_dmg" --arg intel_dmg "$intel_dmg" \
                '[.assets[].name] | contains([$arm_zip, $intel_zip, $arm_dmg, $intel_dmg, "SHA256SUMS"])' <<< "$existing"
            fi
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" SHA256SUMS \
              --verify-tag --title "MiaoRight ${RELEASE_TAG#v}" \
              --notes "DMG installers and ZIP update packages for Apple silicon (arm64) and Intel (x86_64), macOS 14 or later. Use the DMG for the first installation. SHA256SUMS is included for verification."
          fi
